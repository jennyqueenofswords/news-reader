<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The News Reader</title>
<meta name="description" content="Each day, the news is read and rendered as a card. A daily plotter practice.">
<style>

/*
  THE NEWS READER — archive / ledger restyle
  Drop-in replacement for the current <style> block.

  Intent:
  - the plotter cards stay visible and remain the visual focus
  - less "polished AI landing page", more newspaper archive / studio ledger
  - almost monochrome UI; the art gets to own its color
  - no chips, shadows, hover-lift, or scroll-reveal styling
  - no webfonts at all; the Google Fonts links are gone from template.html
*/

:root {
  --paper: #f1f0ed;
  --sheet: #fffefa;
  --ink: #11110f;
  --ink-soft: #676662;
  --hairline: #b9b7b1;
  --rule: #24231f;
  --registration: #982d24;

  --display: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Times New Roman", Times, serif;
  --mono: "Courier New", Courier, monospace;
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    linear-gradient(rgba(17,17,15,.018) 1px, transparent 1px),
    var(--paper);
  background-size: 100% 28px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.5556; /* 28/18 — lands text on the ledger rule below */
  -webkit-font-smoothing: auto;
}

::selection {
  background: var(--ink);
  color: var(--paper);
}

a { color: inherit; }

.wrap {
  width: min(1280px, calc(100% - 48px));
  margin: 0 auto;
  padding: 0;
}


/* MASTHEAD */

header.mast { padding: 28px 0 0; }

h1.title {
  margin: 0;
  padding: 10px 0 8px;
  border-top: 4px double var(--rule);
  border-bottom: 4px double var(--rule);
  font-family: var(--display);
  font-size: clamp(3.4rem, 9vw, 8rem);
  font-weight: 900;
  font-stretch: condensed;
  line-height: .82;
  letter-spacing: -.065em;
  text-align: center;
  text-transform: uppercase;
}

h1.title em {
  font-style: normal;
  font-weight: inherit;
  color: inherit;
}

.mast-blurb {
  max-width: 76ch;
  margin: 22px auto 0;
  font-family: var(--body);
  font-size: 1.03rem;
  font-weight: 400;
  line-height: 1.55;
  text-align: center;
  color: var(--ink);
}

.mast-blurb .lead {
  font-style: normal;
  font-weight: 700;
  color: inherit;
}

/* The masthead's fine-print band. Not the day's number — beside the reading
   count that read as a shortfall. Who publishes it, how far back it goes, and
   since when. The Queen of Swords link lives here rather than in the footer of
   a 78-screen archive, where nobody reaches it. */
.mast-meta {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  padding: 9px 0 8px;
  border-bottom: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: .69rem;
  line-height: 1.25;
  letter-spacing: .06em;
  text-align: center;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.mast-meta span { padding: 0 16px; }

.mast-meta span + span { border-left: 1px solid var(--hairline); }

.mast-meta b { color: var(--ink); font-weight: 700; }

.mast-meta a {
  color: var(--ink-soft);
  text-decoration: underline;
  text-decoration-color: var(--hairline);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

.mast-meta a:hover {
  color: var(--registration);
  text-decoration-color: var(--registration);
}


/* FEED / ARCHIVE */

main { padding: 38px 0 48px; }

.entry {
  display: grid;
  grid-template-columns: minmax(320px, 520px) minmax(0, 1fr);
  gap: clamp(30px, 4vw, 64px);
  align-items: start;
  padding: 42px 0 46px;
  border-bottom: 1px solid var(--rule);
  scroll-margin-top: 24px;
}

.entry:last-child { border-bottom: 0; }

main > .entry:first-of-type {
  grid-template-columns: minmax(360px, 600px) minmax(0, 1fr);
  padding-top: 34px;
  padding-bottom: 54px;
  border-bottom: 3px solid var(--rule);
}


/* ART */

.entry-art { min-width: 0; }

.entry-art .paper {
  position: static;
  display: block;
  overflow: hidden;
  background: var(--sheet);
  border: 1px solid var(--ink);
  border-radius: 0;
  box-shadow: none;
  transform: none;
  transition: none;
}

.entry-art .paper img {
  display: block;
  width: 100%;
  height: auto;
}

.entry-art .paper:hover {
  transform: none;
  box-shadow: none;
}

.entry-art .paper:focus-visible {
  outline: 3px solid var(--registration);
  outline-offset: 4px;
}


/* READING TEXT */

.entry-text {
  min-width: 0;
  padding-top: 0;
}

/* The only heading in the entry: the name of the day, then when it was. The
   serial, the poem and the roman date are all drawn on the card itself, so the
   page does not repeat them. */
.entry-dateline {
  margin: 0 0 14px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--hairline);
  font-family: var(--mono);
  font-size: .78rem;
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--ink);
}

.entry-dateline span {
  font-weight: 400;
  color: var(--ink-soft);
}


/* Keywords: words, not UI components. */

.entry-keys {
  display: block;
  margin: 0 0 22px;
  font-family: var(--mono);
  font-size: .68rem;
  font-weight: 700;
  line-height: 1.55;
  letter-spacing: .055em;
  text-transform: uppercase;
  color: var(--ink);
}

.entry-keys span {
  padding: 0;
  border: 0;
  border-radius: 0;
  color: inherit;
}

.entry-keys span + span::before {
  content: " / ";
  color: var(--ink-soft);
  font-weight: 400;
}


/* Reading: declarative, not "literary app" italic. */


/* Statement = clipping / annotation / archive note. */

.entry-stmt {
  max-width: 52ch;
  margin: 0;
  font-family: var(--body);
  font-size: 1.28rem;
  line-height: 1.366; /* = 28px, so the prose still sits on the ledger rule */
  color: var(--ink);
}

.entry-stmt p { margin: 0 0 .8em; }

.entry-stmt p:last-child { margin-bottom: 0; }


/* Where the day was read. A hairline and the same mono voice as the dateline —
   the page's third citation row, not a call to action. No "Sources" label: the
   publisher names say what these are, and the statement above already lost its
   label for the same reason. */
.entry-src {
  margin: 18px 0 0;
  padding: 12px 0 0;
  border-top: 1px solid var(--hairline);
  list-style: none;
  font-family: var(--mono);
  font-size: .68rem;
  line-height: 1.75;
  letter-spacing: .04em;
  text-transform: uppercase;
}

.entry-src a {
  color: var(--ink-soft);
  text-decoration: underline;
  text-decoration-color: var(--hairline);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

.entry-src a:hover {
  color: var(--registration);
  text-decoration-color: var(--registration);
}

.entry-src b { color: var(--ink); font-weight: 700; }

.entry-noStmt {
  max-width: 52ch;
  margin: 23px 0 0;
  padding-top: 10px;
  border-top: 1px solid var(--hairline);
  font-family: var(--mono);
  font-size: .66rem;
  line-height: 1.4;
  letter-spacing: .045em;
  text-transform: uppercase;
  color: var(--ink-soft);
}


/* FOOTER */

footer {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px 22px;
  margin-top: 0;
  padding: 16px 0 44px;
  border-top: 4px double var(--rule);
  font-family: var(--mono);
  font-size: .67rem;
  line-height: 1.4;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

footer a {
  color: var(--ink);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

footer a:hover { color: var(--registration); }


/* TABLET */

@media (max-width: 900px) {
  .wrap {
    width: min(100% - 36px, 760px);
  }

  .entry,
  main > .entry:first-of-type {
    grid-template-columns: minmax(230px, 48%) minmax(0, 1fr);
    gap: 28px;
  }
}


/* MOBILE */

@media (max-width: 680px) {
  body {
    font-size: 17px;
    line-height: 1.5294; /* 26/17 — keeps the ruling aligned at mobile size */
    background-size: 100% 26px;
  }

  .wrap {
    width: min(100% - 28px, 520px);
  }

  header.mast { padding-top: 16px; }

  h1.title {
    padding: 9px 0 7px;
    font-size: clamp(3.05rem, 18vw, 5.6rem);
    line-height: .84;
  }

  .mast-meta {
    grid-template-columns: 1fr;
    padding: 0;
    text-align: left;
  }

  .mast-meta span { padding: 6px 0; }

  .mast-meta span + span {
    border-top: 1px solid var(--hairline);
    border-left: 0;
  }

  .mast-blurb {
    margin-top: 17px;
    text-align: left;
    font-size: .98rem;
  }

  main { padding-top: 28px; }

  .entry,
  main > .entry:first-of-type {
    grid-template-columns: 1fr;
    gap: 22px;
    padding: 30px 0 34px;
  }

  main > .entry:first-of-type {
    padding-top: 24px;
    padding-bottom: 40px;
  }

  .entry-art { width: 100%; }

  .entry-art .paper {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }

  .entry-stmt {
    max-width: none;
    font-size: 1.12rem;
    line-height: 1.452; /* = 26px at mobile size */
  }

  footer { padding-bottom: 30px; }
}


@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }

  * {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
      <h1 class="title">The News <em>Reader</em></h1>
    <div class="mast-meta">
      <span>est. MMXXVI</span>
      <span><b>__COUNT__</b> readings</span>
      <span>by <a href="https://queenofswords.co" target="_blank" rel="noopener">Queen of Swords</a></span>
    </div>
    <p class="mast-blurb"><span class="lead">The shape of the future is being drawn right now.</span> Each day, we read the news and generate a single card. The weight of the day rendered in ink and plotted on a NextDraw 8511.</p>
  </header>

  <main>
    <!--__FEED__-->
  </main>

  <footer>
    <span>One card per day · read by Claude</span>
  </footer>
</div>

</body>
</html>
